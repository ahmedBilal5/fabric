name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Agent guides match
        run: cmp CLAUDE.md AGENTS.md
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Check icon imports
        run: pnpm check:icons
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Typecheck stories
        run: pnpm typecheck:stories
      - name: Unit tests
        run: pnpm test
      - name: Build Storybook
        run: pnpm storybook:build
