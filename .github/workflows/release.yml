name: Release

# Opens a "Version packages" PR from pending changesets. Merging that PR publishes
# the new versions to npm. Requires an NPM_TOKEN repository secret with publish
# rights on the @fabric-kit scope.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Skip until NPM_TOKEN is set
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN secret is not set, so nothing is published."
      - uses: actions/checkout@v4
        if: env.HAS_NPM_TOKEN == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        if: env.HAS_NPM_TOKEN == 'true'
      - name: Create release PR or publish
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
