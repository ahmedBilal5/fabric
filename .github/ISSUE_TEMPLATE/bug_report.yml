name: Bug report
description: Something in a Fabric package doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@fabric-kit/components 0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or a link to a sandbox helps most.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "React 19, MUI 9.5, Vite 7, Chrome 140"
