<!doctype html>
<!--
  Source of public/og-image.png, the 1200 × 630 preview that link unfurls show (Open Graph
  and Twitter tags in index.html). To update it, open this file in a browser at exactly
  1200 × 630 and save a screenshot over public/og-image.png.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fabric social preview</title>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=block" rel="stylesheet" />
    <style>
      :root {
        --desk: oklch(94.3% 0.008 64);
        --cotton: oklch(98.8% 0.0045 80);
        --ink: oklch(21% 0.012 38);
        --muted: oklch(47% 0.013 45);
        --accent: oklch(54% 0.165 29);
      }
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 72px 80px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: radial-gradient(90% 120% at 0% 30%, var(--cotton), transparent 62%), var(--desk);
        color: var(--ink);
        font-family: "General Sans", ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
      .brand svg { width: 56px; height: 56px; }
      h1 { align-self: center; margin: 0; max-width: 15ch; font-size: 92px; line-height: 1.02; font-weight: 600; letter-spacing: -0.03em; }
      .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: 28px; color: var(--muted); font-weight: 500; }
      code { font: 500 26px ui-monospace, "Geist Mono", monospace; color: var(--ink); }
      code span { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="6" y="12" width="36" height="6" rx="3" fill="#B23E2A"/>
        <rect x="6" y="21" width="36" height="6" rx="3" fill="#B23E2A"/>
        <rect x="6" y="30" width="36" height="6" rx="3" fill="#B23E2A"/>
        <rect x="12" y="6" width="6" height="36" rx="3" fill="#2A2420"/>
        <rect x="21" y="6" width="6" height="36" rx="3" fill="#2A2420"/>
        <rect x="30" y="6" width="6" height="36" rx="3" fill="#2A2420"/>
        <rect x="10" y="12" width="10" height="6" fill="#B23E2A"/>
        <rect x="28" y="12" width="10" height="6" fill="#B23E2A"/>
        <rect x="19" y="21" width="10" height="6" fill="#B23E2A"/>
        <rect x="10" y="30" width="10" height="6" fill="#B23E2A"/>
        <rect x="28" y="30" width="10" height="6" fill="#B23E2A"/>
      </svg>
      Fabric
    </div>
    <h1>MUI, with the app already built.</h1>
    <div class="foot">
      <span>Free, open-source design system and app kits</span>
      <code><span>npm create</span> @fabric-kit/app</code>
    </div>
  </body>
</html>
